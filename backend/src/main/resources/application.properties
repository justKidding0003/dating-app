spring.application.name=identity-service

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/dating_app}
spring.datasource.username=${IDENTITY_DB_USERNAME:dating_user}
spring.datasource.password=${IDENTITY_DB_PASSWORD:dating_password}

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${IDENTITY_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${IDENTITY_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SECURITY SECRETS
# ===============================
identity.security.jwt-key-id=${IDENTITY_JWT_KEY_ID:local-development-key}
identity.security.jwt-private-key-pem=${IDENTITY_JWT_PRIVATE_KEY_PEM:}
identity.security.jwt-public-key-pem=${IDENTITY_JWT_PUBLIC_KEY_PEM:}
identity.security.jwt-issuer=${IDENTITY_JWT_ISSUER:identity-service}
identity.security.jwt-audience=${IDENTITY_JWT_AUDIENCE:dating-app}
identity.security.otp-hmac-secret=${IDENTITY_OTP_HMAC_SECRET:local-development-otp-hmac-secret-change-me}
identity.security.phone-hmac-secret=${IDENTITY_PHONE_HMAC_SECRET:local-development-phone-hmac-secret-change-me}
identity.security.refresh-token-hmac-secret=${IDENTITY_REFRESH_TOKEN_HMAC_SECRET:local-development-refresh-token-hmac-secret-change-me}
identity.security.access-token-ttl=${IDENTITY_ACCESS_TOKEN_TTL:PT15M}
identity.security.refresh-token-ttl=${IDENTITY_REFRESH_TOKEN_TTL:P30D}

# ===============================
# OTP
# ===============================
identity.otp.length=${IDENTITY_OTP_LENGTH:6}
identity.otp.ttl=${IDENTITY_OTP_TTL:PT5M}
identity.otp.resend-cooldown=${IDENTITY_OTP_RESEND_COOLDOWN:PT60S}
identity.otp.request-limit=${IDENTITY_OTP_REQUEST_LIMIT:5}
identity.otp.request-limit-window=${IDENTITY_OTP_REQUEST_LIMIT_WINDOW:PT15M}
identity.otp.max-verification-attempts=${IDENTITY_OTP_MAX_VERIFICATION_ATTEMPTS:5}

# ===============================
# SERVER
# ===============================
server.port=${IDENTITY_SERVICE_PORT:8080}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
