spring.application.name=identity-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

identity.security.jwt-key-id=test-key
identity.security.jwt-private-key-pem=
identity.security.jwt-public-key-pem=
identity.security.jwt-issuer=identity-service-test
identity.security.jwt-audience=dating-app-test
identity.security.otp-hmac-secret=test-otp-hmac-secret
identity.security.phone-hmac-secret=test-phone-hmac-secret
identity.security.refresh-token-hmac-secret=test-refresh-token-hmac-secret
identity.security.access-token-ttl=PT15M
identity.security.refresh-token-ttl=P30D

identity.otp.length=6
identity.otp.ttl=PT5M
identity.otp.resend-cooldown=PT60S
identity.otp.request-limit=5
identity.otp.request-limit-window=PT15M
identity.otp.max-verification-attempts=5
identity.otp.delivery-provider=local
