spring.datasource.url=${IDENTITY_DB_URL}
spring.datasource.username=${IDENTITY_DB_USERNAME}
spring.datasource.password=${IDENTITY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

identity.security.jwt-key-id=${IDENTITY_JWT_KEY_ID}
identity.security.jwt-private-key-pem=${IDENTITY_JWT_PRIVATE_KEY_PEM}
identity.security.jwt-public-key-pem=${IDENTITY_JWT_PUBLIC_KEY_PEM}
identity.security.jwt-issuer=${IDENTITY_JWT_ISSUER}
identity.security.jwt-audience=${IDENTITY_JWT_AUDIENCE}
identity.security.otp-hmac-secret=${IDENTITY_OTP_HMAC_SECRET}
identity.security.phone-hmac-secret=${IDENTITY_PHONE_HMAC_SECRET}
identity.security.refresh-token-hmac-secret=${IDENTITY_REFRESH_TOKEN_HMAC_SECRET}
identity.security.access-token-ttl=${IDENTITY_ACCESS_TOKEN_TTL:PT15M}
identity.security.refresh-token-ttl=${IDENTITY_REFRESH_TOKEN_TTL:P30D}

identity.otp.length=${IDENTITY_OTP_LENGTH:6}
identity.otp.ttl=${IDENTITY_OTP_TTL:PT5M}
identity.otp.resend-cooldown=${IDENTITY_OTP_RESEND_COOLDOWN:PT60S}
identity.otp.request-limit=${IDENTITY_OTP_REQUEST_LIMIT:5}
identity.otp.request-limit-window=${IDENTITY_OTP_REQUEST_LIMIT_WINDOW:PT15M}
identity.otp.max-verification-attempts=${IDENTITY_OTP_MAX_VERIFICATION_ATTEMPTS:5}
identity.otp.delivery-provider=${IDENTITY_OTP_DELIVERY_PROVIDER}
